<!DOCTYPE html>
<html lang="vi">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   ATCX — Settings
  </title>
  <link href="settings.css" rel="stylesheet"/>
  <script src="cookie-theme.js">
  </script>
 </head>
 <body>
  <div class="top">
   <div>
    <h1>
     ⚙️ ATCX Settings
    </h1>
    <p>
     Điều khiển toàn bộ thông số của phòng thí nghiệm.
    </p>
   </div>
   <div class="actions">
    <button id="back">
     ← Phòng thí nghiệm
    </button>
    <button class="primary" id="apply">
     Áp dụng
    </button>
    <button id="quickUI">
     🎨 Giao diện
    </button>
    <button id="reset">
     Khôi phục mặc định
    </button>
   </div>
  </div>
  <div aria-hidden="true" class="quick-ui" id="quickUIPanel">
   <div class="quick-ui-head">
    <strong>
     🎨 Giao diện nhanh
    </strong>
    <button id="quickUIClose" type="button">
     ×
    </button>
   </div>
   <div class="quick-ui-grid">
    <label>
     Ngôn ngữ
     <select id="quickLang">
      <option value="vi">
       🇻🇳 Tiếng Việt
      </option>
      <option value="en">
       🇬🇧 English
      </option>
     </select>
    </label>
    <label>
     Chủ đề
     <select id="quickTheme">
      <option value="dark">
       🌙 Tối
      </option>
      <option value="light">
       ☀️ Sáng
      </option>
     </select>
    </label>
    <label class="wide">
     Ảnh nền URL
     <input id="quickBg" placeholder="https://.../anh.jpg" type="url"/>
    </label>
   </div>
   <div class="quick-presets">
    <button data-quick-bg="" type="button">
     Không ảnh nền
    </button>
    <button data-quick-bg="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&amp;fit=crop&amp;w=1800&amp;q=80" type="button">
     Phòng thí nghiệm
    </button>
    <button data-quick-bg="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&amp;fit=crop&amp;w=1800&amp;q=80" type="button">
     Không gian
    </button>
   </div>
   <div class="quick-cookie">
    <span id="quickCookieState">
     Cookie: —
    </span>
    <button id="quickCookieDelete" type="button">
     🗑️ Xóa cookie
    </button>
   </div>
   <div class="quick-actions">
    <button id="quickPreview" type="button">
     Xem trước
    </button>
    <button class="primary" id="quickSave" type="button">
     Lưu giao diện
    </button>
   </div>
  </div>
  <main id="settings">
  </main>
  <section class="ui-settings-card" id="uiSettings">
   <h2>
    🎨 Giao diện
   </h2>
   <div class="ui-grid">
    <label>
     Ngôn ngữ
     <select id="uiLang">
      <option value="vi">
       🇻🇳 Tiếng Việt
      </option>
      <option value="en">
       🇬🇧 English
      </option>
     </select>
    </label>
    <label>
     Chủ đề
     <select id="uiTheme">
      <option value="dark">
       🌙 Tối
      </option>
      <option value="light">
       ☀️ Sáng
      </option>
     </select>
    </label>
    <label class="wide">
     Ảnh nền URL
     <input id="uiBg" placeholder="https://.../anh.jpg" type="url"/>
    </label>
    <label class="wide">
     Hoặc chọn ảnh từ máy
     <input accept="image/*" id="uiBgFile" type="file"/>
    </label>
   </div>
   <div class="bg-presets">
    <button data-bg="">
     Không ảnh nền
    </button>
    <button data-bg="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&amp;fit=crop&amp;w=1800&amp;q=80">
     Phòng thí nghiệm
    </button>
    <button data-bg="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&amp;fit=crop&amp;w=1800&amp;q=80">
     Không gian
    </button>
   </div>
   <div class="ui-actions">
    <button id="uiPreview">
     Xem trước
    </button>
    <button class="primary" id="uiSave">
     Lưu giao diện
    </button>
   </div>
   <div class="cookie-card">
    <h3>
     🍪 Dữ liệu cookie
    </h3>
    <p>
     Chỉ lưu ngôn ngữ, chủ đề sáng/tối và ảnh nền. Không lưu thông số mô phỏng bằng cookie.
    </p>
    <div id="cookieState">
    </div>
    <button id="cookieDelete">
     🗑️ Xóa dữ liệu cookie
    </button>
    <button id="cookieReask">
     🍪 Hỏi lại về cookie
    </button>
   </div>
  </section>
  <div id="toast">
  </div>
  <script src="settings.js">
  </script>
  <script src="ui-settings.js">
  </script>
 </body>
</html>
